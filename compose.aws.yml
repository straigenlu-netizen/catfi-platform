# Use with compose.yml; credentials come from your local AWS profile, never this file.
services:
  reporting-service:
    environment:
      SPRING_PROFILES_ACTIVE: aws
      CATFI_REPORTING_TABLE: ${CATFI_REPORTING_TABLE:?Use ReportingTable stack output}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+ExitOnOutOfMemoryError -Duser.home=/aws
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_CONFIG_FILE: /aws/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/.aws/credentials
    volumes:
      - ${CATFI_AWS_CONFIG_DIR:?Absolute path to your AWS config directory}:/aws/.aws:ro
  weather-service:
    environment:
      SPRING_PROFILES_ACTIVE: aws
      CATFI_WEATHER_TABLE: ${CATFI_WEATHER_TABLE:?Use WeatherTable stack output}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:+ExitOnOutOfMemoryError -Duser.home=/aws
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_CONFIG_FILE: /aws/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/.aws/credentials
    volumes:
      - ${CATFI_AWS_CONFIG_DIR:?Absolute path to your AWS config directory}:/aws/.aws:ro
