server:
  port: 8082

spring:
  application:
    name: weather-service
  cache:
    type: redis
    cache-names: weather
    redis:
      time-to-live: 5m
      cache-null-values: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

weather:
  api:
    key: ${WEATHER_API_KEY:}

logging:
  level:
    dev.catfi.weather: DEBUG
