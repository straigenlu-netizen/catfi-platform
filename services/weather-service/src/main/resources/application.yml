server:
  port: 8082

spring:
  application:
    name: weather-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

weather:
  api:
    key: ${WEATHER_API_KEY:}

logging:
  level:
    dev.catfi.weather: DEBUG
