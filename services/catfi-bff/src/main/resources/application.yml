server:
  address: 127.0.0.1
  port: 8087
  servlet:
    session:
      timeout: 10m

spring:
  application:
    name: catfi-bff
  sql:
    init:
      mode: always
  datasource:
    url: ${CATFI_DB_URL:jdbc:postgresql://localhost:5432/catfi_compensation}
    username: ${CATFI_DB_USER:catfi}
    password: ${CATFI_DB_PASSWORD:}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

catfi:
  audit:
    retention-days: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
