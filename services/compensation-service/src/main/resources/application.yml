spring:
  application:
    name: compensation-service
  datasource:
    url: ${CATFI_DB_URL:jdbc:postgresql://localhost:5432/catfi_compensation}
    username: ${CATFI_DB_USER:postgres}
    password: ${CATFI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CATFI_JWT_ISSUER:http://localhost:8180/realms/catfi}
          jwk-set-uri: ${CATFI_JWT_JWKS:http://localhost:8180/realms/catfi/protocol/openid-connect/certs}
          audiences: compensation-service
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: compensation-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "dev.catfi.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

server:
  address: 127.0.0.1
  port: 8081
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    dev.catfi.compensation: DEBUG
