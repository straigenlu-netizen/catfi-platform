name: Notify CI failure using AWS
on:
  workflow_run:
    workflows: [CatFi CI, Code security]
    types: [completed]
permissions:
  contents: read
  id-token: write
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    environment: aws-dev
    runs-on: ubuntu-latest
    steps:
      # No checkout or execution of code from the triggering workflow.
      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.AWS_ALERT_TOPIC_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: vars.AWS_ALERT_TOPIC_ARN != ''
        env:
          ALERT_TOPIC: ${{ vars.AWS_ALERT_TOPIC_ARN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: aws sns publish --topic-arn "$ALERT_TOPIC" --subject 'CatFi CI failed' --message "Checks failed. $RUN_URL"
