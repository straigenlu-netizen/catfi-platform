name: Code security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    # Private repositories require GitHub Code Security entitlement.
    if: vars.CATFI_ENABLE_CODEQL == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin,javascript-typescript
      - run: ./mvnw -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@v3
  sonar:
    if: vars.CATFI_ENABLE_SONAR == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests and enforce configured Sonar quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          ./mvnw -B -ntp verify -Pintegration \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" -Dsonar.qualitygate.wait=true
