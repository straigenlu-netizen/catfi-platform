name: catfi
x-backend: &backend
  image: catfi-backend:local
  pull_policy: never
  environment: &backend-environment
    SERVER_ADDRESS: 0.0.0.0
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    SERVICES_POLICY_URL: http://property-policy-service:8084
    SERVICES_USER_URL: http://user-service:8080
    SERVICES_REPORTING_URL: http://reporting-service:8085
    SERVICES_DISASTER_URL: http://disaster-simulator:8086
services:
  compensation-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: catfi_compensation
      POSTGRES_USER: ${CATFI_DB_USER:-catfi}
      POSTGRES_PASSWORD: ${CATFI_DB_PASSWORD:?Set CATFI_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - compensation-db:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  mongo:
    image: mongo:8.0
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
  redis:
    image: redis:7.4-alpine
    profiles: [enrichment]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [tools]
    ports: ["127.0.0.1:8088:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: catfi-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: {condition: service_healthy}
  user-service:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: user-service
      SPRING_PROFILES_ACTIVE: demo
  property-policy-service:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: property-policy-service
      SPRING_PROFILES_ACTIVE: demo
  reporting-service:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: reporting-service
    depends_on:
      kafka: {condition: service_healthy}
  disaster-simulator:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: disaster-simulator
    depends_on:
      kafka: {condition: service_healthy}
  sensor-simulator:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: sensor-simulator
    depends_on:
      kafka: {condition: service_healthy}
      property-policy-service: {condition: service_started}
  damage-service:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: damage-service
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/catfi_damage
    depends_on:
      kafka: {condition: service_healthy}
      mongo: {condition: service_healthy}
  compensation-service:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: compensation-service
      CATFI_DB_URL: jdbc:postgresql://compensation-db:5432/catfi_compensation
      CATFI_DB_USER: ${CATFI_DB_USER:-catfi}
      CATFI_DB_PASSWORD: ${CATFI_DB_PASSWORD:?Set CATFI_DB_PASSWORD in .env}
    depends_on:
      kafka: {condition: service_healthy}
      compensation-db: {condition: service_healthy}
      property-policy-service: {condition: service_started}
  payment-service:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: payment-service
      CATFI_DB_URL: jdbc:postgresql://compensation-db:5432/catfi_payments
      CATFI_DB_USER: ${CATFI_DB_USER:-catfi}
      CATFI_DB_PASSWORD: ${CATFI_DB_PASSWORD:?Set CATFI_DB_PASSWORD in .env}
    depends_on:
      kafka: {condition: service_healthy}
      compensation-db: {condition: service_healthy}
  investment-service:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: investment-service
    depends_on:
      kafka: {condition: service_healthy}
      property-policy-service: {condition: service_started}
      user-service: {condition: service_started}
  portfolio-service:
    <<: *backend
    environment:
      <<: *backend-environment
      CATFI_SERVICE: portfolio-service
      CATFI_DB_URL: jdbc:postgresql://compensation-db:5432/catfi_portfolio
      CATFI_DB_USER: ${CATFI_DB_USER:-catfi}
      CATFI_DB_PASSWORD: ${CATFI_DB_PASSWORD:?Set CATFI_DB_PASSWORD in .env}
    depends_on:
      kafka: {condition: service_healthy}
      compensation-db: {condition: service_healthy}
  catfi-bff:
    <<: *backend
    build: .
    ports: ["127.0.0.1:8087:8087"]
    environment:
      <<: *backend-environment
      CATFI_SERVICE: catfi-bff
    depends_on:
      user-service: {condition: service_started}
      property-policy-service: {condition: service_started}
      reporting-service: {condition: service_started}
      disaster-simulator: {condition: service_started}
  web-ui:
    build: ./web-ui
    ports: ["127.0.0.1:5173:80"]
    depends_on: [catfi-bff]
  market-data-service:
    <<: *backend
    profiles: [enrichment]
    environment:
      <<: *backend-environment
      CATFI_SERVICE: market-data-service
    depends_on:
      kafka: {condition: service_healthy}
  market-shock-service:
    <<: *backend
    profiles: [enrichment]
    environment:
      <<: *backend-environment
      CATFI_SERVICE: market-shock-service
    depends_on:
      kafka: {condition: service_healthy}
  weather-service:
    <<: *backend
    profiles: [enrichment]
    environment:
      <<: *backend-environment
      CATFI_SERVICE: weather-service
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      redis: {condition: service_healthy}
volumes:
  compensation-db:
  mongo-data:
  redis-data:
